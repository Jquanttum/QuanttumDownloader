name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean QuanttumDownloader.spec
      - run: Compress-Archive -Path dist/QuanttumDownloader/* -DestinationPath QuanttumDownloader-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: QuanttumDownloader-windows, path: QuanttumDownloader-windows.zip }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: QuanttumDownloader-windows.zip }
